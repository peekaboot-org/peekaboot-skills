version: 2
updates:
  # Dependabot opens pull requests against the default branch unless told otherwise, and main
  # only fast-forwards to dev.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "maven"
    directory: "/test-app"
    target-branch: "dev"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      # Peekaboot's own release needs no week of quarantine before the recipes run against it.
      exclude:
        - "org.peekaboot:*"
  - package-ecosystem: "npm"
    directory: "/.github/ci"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "pip"
    directory: "/.github/ci"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
